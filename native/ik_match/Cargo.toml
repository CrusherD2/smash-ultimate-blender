[package]
name = "sub_ik_match_probe"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-or-later"
description = "Blender IK matching accelerator with conservative solver fallback"

[lib]
name = "sub_ik_match_native"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
cc = "1.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
